{% extends 'base.html' %}
{% block title %}Entrar — Sistema de Aprovação{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-form-side">
            <h1 class="login-title">Bem-vindo <span>de volta</span></h1>
            <p class="login-subtitle">Faça login para acessar o sistema</p>

            <form method="post" action="{{ url_for('autenticacao.login') }}" class="login-form">
                <div class="form-group">
                    <label for="chapa" class="form-label">Chapa</label>
                    <input class="form-control" type="text" id="chapa" name="chapa"
                        placeholder="Digite sua chapa (com 0 na frente)" required>
                </div>

                <div class="form-group">
                    <label for="senha" class="form-label">Senha</label>
                    <input class="form-control" type="password" id="senha" name="senha"
                        placeholder="Digite sua senha" required>
                </div>

                <button class="btn btn-primary" type="submit">Entrar</button>

                <a href="{{ url_for('autenticacao.recuperar_senha') }}" class="login-forgot">
                    Esqueceu a senha? Enviar link por email
                </a>
            </form>
        </div>

        <div class="login-image-side">
            <img src="https://img.freepik.com/vetores-premium/atendimento-ao-cliente-atendimento-ao-agente-suporte_165162-670.jpg"
                alt="Suporte ao cliente">
        </div>
    </div>
</div>
{% endblock %}
