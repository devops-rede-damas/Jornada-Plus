{% extends 'base.html' %}
{% block title %}Recuperar Senha — Sistema de Aprovação{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <h2>Recuperar Senha</h2>
        <form method="post" action="{{ url_for('autenticacao.recuperar_senha') }}">
            <div class="form-group">
                <label for="email" class="form-label">Seu email cadastrado</label>
                <input type="email" id="email" name="email" required class="form-control"
                    placeholder="Digite seu email">
            </div>
            <button type="submit" class="btn btn-primary">Enviar link por email</button>
        </form>
    </div>
</div>
{% endblock %}
